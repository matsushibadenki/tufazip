[package]
name = "tufazip"
version = "0.1.0"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
walkdir = "2"
tempfile = "3"
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
rustix = { version = "1", features = ["fs"] }
crc32fast = "1"
